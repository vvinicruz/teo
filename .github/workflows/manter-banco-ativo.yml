# visita o banco do supabase uma vez por dia para o plano grátis não pausar por inatividade.
# a chave usada é a "publishable" (pública, a mesma que vai dentro do app).
name: manter banco ativo
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
jobs:
  visita:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "https://rpyqlnbepnwydiwcohvc.supabase.co/rest/v1/categories?select=id&limit=1" \
            -H "apikey: sb_publishable_zKau_cC0gVYjZuf55l848Q_y62L-bto" -o /dev/null -w "status %{http_code}\n"
