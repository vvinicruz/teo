<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover deixa o app usar a tela toda do iphone, respeitando o notch -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="teo — tudo em ordem. gestão financeira simples, do seu jeito e no seu ritmo." />

    <!-- "adicionar à tela de início" no iphone abre como app, sem a barra do safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="teo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #fffaf6;
      }
      body {
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>o teo precisa de javascript ligado para funcionar.</noscript>
    <div id="root"></div>
  </body>
</html>
